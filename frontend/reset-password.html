<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Set New Password — Gwin's Readers Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=1785495775" rel="stylesheet">
<link rel="icon" type="image/png" href="img/logo-32.png">
</head>
<body>

<nav class="navbar navbar-rc">
  <div class="container"><a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="Gwin's Readers Club" class="navbar-logo-img">Gwin's Readers Club</a></div>
</nav>

<div class="container" style="max-width: 420px; margin-top: 60px;">
  <div class="card card-rc p-4">
    <h4 class="mb-3 text-center">Set a New Password</h4>
    <div id="alert-box"></div>
    <form id="reset-confirm-form">
      <div class="mb-3">
        <label class="form-label">New Password</label>
        <input type="password" class="form-control" id="new_password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-rc w-100">Reset Password</button>
    </form>
    <p class="text-center mt-3 mb-0 small"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="js/api.js?v=1785495775"></script>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get("token");
if (!token) showAlert("alert-box", "This reset link is missing its token — request a new one from the forgot-password page.");

document.getElementById("reset-confirm-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const new_password = document.getElementById("new_password").value;
  try {
    await api("/auth/password-reset/confirm", { method: "POST", body: JSON.stringify({ token, new_password }) });
    showAlert("alert-box", "Password reset! Redirecting to log in...", "success");
    setTimeout(() => window.location.href = "login.html", 1500);
  } catch (err) {
    showAlert("alert-box", err.message);
  }
});
</script>
</body>
</html>
