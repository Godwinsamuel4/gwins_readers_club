<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Opportunities Hub — Gwin's Readers Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=1785495775" rel="stylesheet">
<link rel="icon" type="image/png" href="img/logo-32.png">
</head>
<body>

<div id="rc-nav"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>🎓 Opportunities Hub</h3>
    <button class="btn btn-rc btn-sm" id="add-opp-btn" style="display:none;" data-bs-toggle="modal" data-bs-target="#oppModal">+ Post Opportunity</button>
  </div>
  <p class="text-muted small">Scholarships, internships, competitions, essay contests, conferences, leadership programs, and volunteer opportunities.</p>

  <div class="mb-3">
    <div class="btn-group flex-wrap" id="type-tabs">
      <button class="btn btn-outline-secondary btn-sm active" data-type="">All</button>
      <button class="btn btn-outline-secondary btn-sm" data-type="scholarship">Scholarships</button>
      <button class="btn btn-outline-secondary btn-sm" data-type="internship">Internships</button>
      <button class="btn btn-outline-secondary btn-sm" data-type="competition">Competitions</button>
      <button class="btn btn-outline-secondary btn-sm" data-type="essay_contest">Essay Contests</button>
      <button class="btn btn-outline-secondary btn-sm" data-type="conference">Conferences</button>
      <button class="btn btn-outline-secondary btn-sm" data-type="leadership_program">Leadership</button>
      <button class="btn btn-outline-secondary btn-sm" data-type="volunteer">Volunteer</button>
    </div>
    <button class="btn btn-outline-warning btn-sm ms-2" id="saved-tab-btn" onclick="showSavedOnly()">⭐ My Saved</button>
  </div>

  <div class="row g-4" id="opportunities-grid">Loading...</div>
</div>

<div class="modal fade" id="oppModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Post an Opportunity</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="opp-alert"></div>
        <div class="mb-2">
          <label class="form-label">Type</label>
          <select class="form-select" id="o_type">
            <option value="scholarship">Scholarship</option>
            <option value="internship">Internship</option>
            <option value="competition">Competition</option>
            <option value="essay_contest">Essay Contest</option>
            <option value="conference">Conference</option>
            <option value="leadership_program">Leadership Program</option>
            <option value="volunteer">Volunteer</option>
          </select>
        </div>
        <div class="mb-2"><label class="form-label">Title</label><input class="form-control" id="o_title"></div>
        <div class="mb-2"><label class="form-label">Organization <small class="text-muted">(optional)</small></label><input class="form-control" id="o_organization" placeholder="e.g. MTN Foundation"></div>
        <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" id="o_description" rows="3"></textarea></div>
        <div class="mb-2"><label class="form-label">Application URL <small class="text-muted">(where members apply)</small></label><input type="url" class="form-control" id="o_url" placeholder="https://..."></div>
        <div class="mb-2"><label class="form-label">Deadline</label><input type="date" class="form-control" id="o_deadline"></div>
        <div class="mb-2"><label class="form-label">Logo / Cover Image <small class="text-muted">(optional)</small></label><input type="file" class="form-control" id="o_logo" accept="image/*"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-rc" id="opp-modal-submit-btn" onclick="submitOpportunity()">Post</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=1785495775"></script>
<script>
requireAuth();
renderNav("opportunities");
const user = getUser();
if (["admin", "moderator"].includes(user.role)) {
  document.getElementById("add-opp-btn").style.display = "inline-block";
}

const typeLabels = {
  scholarship: "Scholarship", internship: "Internship", competition: "Competition",
  essay_contest: "Essay Contest", conference: "Conference",
  leadership_program: "Leadership Program", volunteer: "Volunteer",
};
let activeType = "";
let showingSavedOnly = false;

function daysUntil(deadline) {
  if (!deadline) return null;
  const diff = Math.ceil((new Date(deadline) - new Date()) / (1000*60*60*24));
  return diff;
}

async function loadOpportunities() {
  let opportunities;
  if (showingSavedOnly) {
    opportunities = await api("/opportunities/saved");
  } else {
    const params = new URLSearchParams();
    if (activeType) params.append("opportunity_type", activeType);
    opportunities = await api(`/opportunities?${params.toString()}`);
  }
  const grid = document.getElementById("opportunities-grid");
  if (!opportunities.length) {
    grid.innerHTML = `<p class="text-muted">${showingSavedOnly ? "You haven't saved any opportunities yet." : "No open opportunities right now — check back soon."}</p>`;
    return;
  }
  grid.innerHTML = opportunities.map(o => {
    const days = daysUntil(o.deadline);
    const urgent = days !== null && days <= 7;
    return `
      <div class="col-md-4">
        <div class="card card-rc h-100 overflow-hidden">
          <div style="height:130px; background:${o.logo_url ? "#fff" : "var(--rc-navy)"}; display:flex; align-items:center; justify-content:center; overflow:hidden; border-bottom:1px solid var(--rc-line);">
            ${o.logo_url
              ? `<img src="${o.logo_url}" alt="${escapeHtml(o.organization || o.title)} logo" style="max-height:100%; max-width:100%; object-fit:contain; padding:10px;">`
              : `<span style="color:var(--rc-cream); font-family:var(--rc-font-display); font-size:1.4rem; text-align:center; padding:0 16px;">${escapeHtml(o.title)}</span>`}
          </div>
          <div class="p-3 d-flex flex-column h-100">
            <div class="d-flex justify-content-between align-items-start">
              <span class="category-pill mb-2" style="width:fit-content;">${typeLabels[o.opportunity_type] || o.opportunity_type}</span>
              <button class="btn btn-sm btn-link p-0" style="font-size:1.1rem;" onclick="toggleSave(${o.id}, ${o.is_saved})" title="${o.is_saved ? "Unsave" : "Save"}">${o.is_saved ? "⭐" : "☆"}</button>
            </div>
            <h5 class="mb-0">${escapeHtml(o.title)}</h5>
            ${o.organization ? `<div class="text-muted small mb-1">${escapeHtml(o.organization)}</div>` : ""}
            <p class="small mt-1">${escapeHtml(o.description)}</p>
            <div class="mt-auto">
              ${o.deadline ? `<div class="small ${urgent ? "text-danger fw-bold" : "text-muted"} mb-2">Deadline: ${o.deadline}${urgent ? ` (${days}d left)` : ""}</div>` : ""}
              ${o.application_url
                ? `<a href="${o.application_url}" target="_blank" rel="noopener" class="btn btn-rc-gold w-100 fw-bold">Apply Now ↗</a>`
                : `<div class="small text-muted fst-italic">No application link provided</div>`}
              <div class="form-check mt-2">
                <input class="form-check-input" type="checkbox" id="applied-${o.id}" ${o.applied ? "checked" : ""} onchange="toggleApplied(${o.id}, this.checked)">
                <label class="form-check-label small" for="applied-${o.id}">I've applied</label>
              </div>
              ${["admin","moderator"].includes(user.role) ? `
                <button class="btn btn-sm btn-link p-0" onclick="openEditOpp(${o.id})">Edit</button>
                <button class="btn btn-sm btn-link text-danger ms-2" onclick="deleteOpp(${o.id})">Remove</button>` : ""}
            </div>
          </div>
        </div>
      </div>
    `;
  }).join("");
  window._oppCache = Object.fromEntries(opportunities.map(o => [o.id, o]));
}

function showSavedOnly() {
  showingSavedOnly = true;
  document.querySelectorAll("#type-tabs button").forEach(b => b.classList.remove("active"));
  document.getElementById("saved-tab-btn").classList.add("active");
  loadOpportunities();
}

async function toggleSave(id, isSaved) {
  await api(`/opportunities/${id}/save`, { method: isSaved ? "DELETE" : "POST" });
  loadOpportunities();
}

async function toggleApplied(id, applied) {
  await api(`/opportunities/${id}/applied?applied=${applied}`, { method: "PUT" });
}

let editingOppId = null;

function openEditOpp(id) {
  const o = window._oppCache[id];
  if (!o) return;
  editingOppId = id;
  document.querySelector("#oppModal .modal-title").textContent = "Edit Opportunity";
  document.getElementById("o_type").value = o.opportunity_type;
  document.getElementById("o_title").value = o.title;
  document.getElementById("o_organization").value = o.organization || "";
  document.getElementById("o_description").value = o.description;
  document.getElementById("o_url").value = o.application_url || "";
  document.getElementById("o_deadline").value = o.deadline || "";
  document.getElementById("o_logo").value = "";
  document.getElementById("opp-modal-submit-btn").textContent = "Save Changes";
  bootstrap.Modal.getOrCreateInstance(document.getElementById("oppModal")).show();
}

document.getElementById("oppModal").addEventListener("hidden.bs.modal", () => {
  editingOppId = null;
  document.querySelector("#oppModal .modal-title").textContent = "Post an Opportunity";
  document.getElementById("opp-modal-submit-btn").textContent = "Post";
  ["o_type","o_title","o_organization","o_description","o_url","o_deadline","o_logo"].forEach(id => document.getElementById(id).value = "");
});

document.querySelectorAll("#type-tabs button").forEach(btn => {
  btn.addEventListener("click", () => {
    showingSavedOnly = false;
    document.getElementById("saved-tab-btn").classList.remove("active");
    document.querySelectorAll("#type-tabs button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeType = btn.dataset.type;
    loadOpportunities();
  });
});

async function deleteOpp(id) {
  if (!confirm("Remove this opportunity?")) return;
  await api(`/opportunities/${id}`, { method: "DELETE" });
  loadOpportunities();
}

async function submitOpportunity() {
  const payload = {
    opportunity_type: document.getElementById("o_type").value,
    title: document.getElementById("o_title").value,
    organization: document.getElementById("o_organization").value || null,
    description: document.getElementById("o_description").value,
    application_url: document.getElementById("o_url").value || null,
    deadline: document.getElementById("o_deadline").value || null,
  };
  const logoFile = document.getElementById("o_logo").files[0];
  try {
    let oppId = editingOppId;
    if (editingOppId) {
      await api(`/opportunities/${editingOppId}`, { method: "PUT", body: JSON.stringify(payload) });
    } else {
      const created = await api("/opportunities", { method: "POST", body: JSON.stringify(payload) });
      oppId = created.id;
    }
    if (logoFile && oppId) {
      const fd = new FormData();
      fd.append("file", logoFile);
      await apiUpload(`/opportunities/${oppId}/logo`, fd);
    }
    bootstrap.Modal.getInstance(document.getElementById("oppModal")).hide();
    loadOpportunities();
  } catch (err) {
    showAlert("opp-alert", err.message);
  }
}

loadOpportunities();
</script>
</body>
</html>
