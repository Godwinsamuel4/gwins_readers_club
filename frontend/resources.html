<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reading Resources — Gwin's Readers Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=1785495775" rel="stylesheet">
<link rel="icon" type="image/png" href="img/logo-32.png">
</head>
<body>

<div id="rc-nav"></div>

<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>📑 Reading Resources</h3>
    <button class="btn btn-rc btn-sm" id="add-resource-btn" style="display:none;" data-bs-toggle="modal" data-bs-target="#resourceModal">+ Add Resource</button>
  </div>
  <p class="text-muted small">Chapter summaries, study guides, vocabulary lists, author bios, and discussion guides.</p>

  <div class="row g-2 mb-4">
    <div class="col-md-3">
      <select class="form-select" id="type-filter" onchange="loadResources()">
        <option value="">All Types</option>
        <option value="chapter_summary">Chapter Summaries</option>
        <option value="study_guide">Study Guides</option>
        <option value="vocabulary_list">Vocabulary Lists</option>
        <option value="author_bio">Author Bios</option>
        <option value="reading_guide">Reading Guides</option>
        <option value="discussion_guide">Discussion Guides</option>
      </select>
    </div>
    <div class="col-md-4">
      <select class="form-select" id="book-filter" onchange="loadResources()">
        <option value="">All Books</option>
      </select>
    </div>
  </div>

  <div id="resources-list">Loading...</div>
</div>

<div class="modal fade" id="resourceModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Add a Reading Resource</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div id="resource-alert"></div>
        <div class="row g-2">
          <div class="col-md-6">
            <label class="form-label">Type</label>
            <select class="form-select" id="r_type">
              <option value="chapter_summary">Chapter Summary</option>
              <option value="study_guide">Study Guide</option>
              <option value="vocabulary_list">Vocabulary List</option>
              <option value="author_bio">Author Bio</option>
              <option value="reading_guide">Reading Guide</option>
              <option value="discussion_guide">Discussion Guide</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Linked Book (optional)</label>
            <select class="form-select" id="r_book_id"><option value="">General resource</option></select>
          </div>
          <div class="col-md-12"><label class="form-label">Title</label><input class="form-control" id="r_title"></div>
          <div class="col-md-12"><label class="form-label">Content</label><textarea class="form-control" id="r_content" rows="6"></textarea></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-rc" onclick="submitResource()">Add Resource</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=1785495775"></script>
<script>
requireAuth();
renderNav("resources");
const user = getUser();
if (["admin", "mentor"].includes(user.role)) {
  document.getElementById("add-resource-btn").style.display = "inline-block";
}

const typeLabels = {
  chapter_summary: "Chapter Summary", study_guide: "Study Guide", vocabulary_list: "Vocabulary List",
  author_bio: "Author Bio", reading_guide: "Reading Guide", discussion_guide: "Discussion Guide",
};

async function loadBookOptions() {
  const books = await api("/library/books?sort=title");
  const filterSel = document.getElementById("book-filter");
  const formSel = document.getElementById("r_book_id");
  books.forEach(b => {
    filterSel.innerHTML += `<option value="${b.id}">${b.title}</option>`;
    formSel.innerHTML += `<option value="${b.id}">${b.title}</option>`;
  });
}

async function loadResources() {
  const type = document.getElementById("type-filter").value;
  const bookId = document.getElementById("book-filter").value;
  const params = new URLSearchParams();
  if (type) params.append("resource_type", type);
  if (bookId) params.append("book_id", bookId);
  const resources = await api(`/resources?${params.toString()}`);
  const el = document.getElementById("resources-list");
  if (!resources.length) { el.innerHTML = `<p class="text-muted">No resources yet.</p>`; return; }
  el.innerHTML = resources.map(r => `
    <div class="card card-rc p-3 mb-2" data-resource-id="${r.id}">
      <div class="d-flex justify-content-between">
        <div>
          <span class="category-pill">${typeLabels[r.resource_type] || r.resource_type}</span>
          ${r.book_title ? `<span class="text-muted small ms-2">for "${escapeHtml(r.book_title)}"</span>` : `<span class="text-muted small ms-2">General</span>`}
        </div>
        ${["admin","moderator","mentor"].includes(user.role) ? `<button class="btn btn-sm btn-link p-0 me-2 resource-edit-btn" data-id="${r.id}">Edit</button>` : ""}
        ${["admin","moderator"].includes(user.role) ? `<button class="btn btn-sm btn-link text-danger p-0" onclick="deleteResource(${r.id})">✕</button>` : ""}
      </div>
      <h6 class="mt-2 mb-1">${escapeHtml(r.title)}</h6>
      <p class="mb-0 small" style="white-space: pre-wrap;">${escapeHtml(r.content)}</p>
    </div>
  `).join("");
  el.querySelectorAll(".resource-edit-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.id);
      const resource = resources.find(r => r.id === id);
      if (resource) editResource(id, resource.title, resource.content);
    });
  });
}

async function editResource(id, currentTitle, currentContent) {
  const title = prompt("Title:", currentTitle);
  if (title === null) return;
  const content = prompt("Content:", currentContent);
  if (content === null) return;
  await api(`/resources/${id}`, { method: "PUT", body: JSON.stringify({ title, content }) });
  loadResources();
}

async function deleteResource(id) {
  if (!confirm("Delete this resource?")) return;
  await api(`/resources/${id}`, { method: "DELETE" });
  loadResources();
}

async function submitResource() {
  const payload = {
    resource_type: document.getElementById("r_type").value,
    book_id: document.getElementById("r_book_id").value ? parseInt(document.getElementById("r_book_id").value) : null,
    title: document.getElementById("r_title").value,
    content: document.getElementById("r_content").value,
  };
  try {
    await api("/resources", { method: "POST", body: JSON.stringify(payload) });
    bootstrap.Modal.getInstance(document.getElementById("resourceModal")).hide();
    loadResources();
  } catch (err) {
    showAlert("resource-alert", err.message);
  }
}

loadBookOptions();
loadResources();
</script>
</body>
</html>
