<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Forgot Password — Gwin's Readers Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=1785495775" rel="stylesheet">
<link rel="icon" type="image/png" href="img/logo-32.png">
</head>
<body>

<nav class="navbar navbar-rc">
  <div class="container"><a class="navbar-brand" href="index.html"><img src="img/logo.png" alt="Gwin's Readers Club" class="navbar-logo-img">Gwin's Readers Club</a></div>
</nav>

<div class="container" style="max-width: 420px; margin-top: 60px;">
  <div class="card card-rc p-4">
    <h4 class="mb-3 text-center">Reset Your Password</h4>
    <div id="alert-box"></div>
    <form id="reset-request-form">
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <button type="submit" class="btn btn-rc w-100">Send Reset Link</button>
    </form>
    <p class="text-center mt-3 mb-0 small"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="js/api.js?v=1785495775"></script>
<script>
document.getElementById("reset-request-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  try {
    const r = await api("/auth/password-reset", { method: "POST", body: JSON.stringify({ email }) });
    // Dev mode: no SMTP is configured, so the reset link is shown directly
    // here instead of emailed. In production this dev_token block would not exist.
    let msg = r.message;
    if (r.dev_token) {
      msg += `<br><br><strong>Dev mode</strong> — no email server configured, so here's your reset link:<br>
        <a href="reset-password.html?token=${r.dev_token}">reset-password.html?token=${r.dev_token}</a>`;
    }
    showAlert("alert-box", msg, "success");
  } catch (err) {
    showAlert("alert-box", err.message);
  }
});
</script>
</body>
</html>
