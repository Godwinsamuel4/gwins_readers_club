<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Notifications — Gwin's Readers Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=1785495775" rel="stylesheet">
<link rel="icon" type="image/png" href="img/logo-32.png">
</head>
<body>

<div id="rc-nav"></div>

<div class="container py-4" style="max-width: 700px;">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3>🔔 Notifications</h3>
    <div>
      <button class="btn btn-sm btn-outline-secondary" onclick="toggleSettings()">⚙️ Preferences</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="markAllRead()">Mark all as read</button>
    </div>
  </div>
  <div id="settings-panel" class="card card-rc p-3 mb-3 d-none">
    <h6>Mute categories</h6>
    <p class="text-muted small">Turn off notifications you don't want to receive.</p>
    <div id="preferences-list">Loading...</div>
  </div>
  <div id="notif-list">Loading...</div>
</div>

<script src="js/api.js?v=1785495775"></script>
<script>
requireAuth();
renderNav("dashboard");

const KNOWN_CATEGORIES = ["announcement", "club", "mentorship", "discussion", "general"];

async function loadNotifications() {
  const notifs = await api("/notifications");
  const el = document.getElementById("notif-list");
  if (!notifs.length) { el.innerHTML = `<p class="text-muted">No notifications yet.</p>`; return; }
  el.innerHTML = notifs.map(n => `
    <div class="card card-rc p-3 mb-2 ${n.is_read ? "" : "border-start border-4"}" style="${n.is_read ? "" : "border-color: var(--rc-gold) !important;"}">
      <div class="d-flex justify-content-between">
        <span class="category-pill">${n.notif_type}</span>
        <div>
          <span class="text-muted small">${timeAgo(n.created_at)}</span>
          <button class="btn btn-sm btn-link text-danger p-0 ms-2" onclick="deleteNotification(${n.id})">✕</button>
        </div>
      </div>
      <p class="mb-0 mt-2">${escapeHtml(n.message)}</p>
      ${n.is_read ? "" : `<button class="btn btn-sm btn-link p-0 mt-1" style="width:fit-content;" onclick="markRead(${n.id})">Mark as read</button>`}
    </div>
  `).join("");
}

async function deleteNotification(id) {
  await api(`/notifications/${id}`, { method: "DELETE" });
  loadNotifications();
}

async function markRead(id) {
  await api(`/notifications/${id}/read`, { method: "PUT" });
  loadNotifications();
}

async function markAllRead() {
  await api("/notifications/mark-all-read", { method: "PUT" });
  loadNotifications();
}

function toggleSettings() {
  const panel = document.getElementById("settings-panel");
  panel.classList.toggle("d-none");
  if (!panel.classList.contains("d-none")) loadPreferences();
}

async function loadPreferences() {
  const prefs = await api("/notifications/preferences");
  const mutedSet = new Set(prefs.filter(p => p.muted).map(p => p.category));
  const el = document.getElementById("preferences-list");
  el.innerHTML = KNOWN_CATEGORIES.map(cat => `
    <div class="form-check form-switch mb-1">
      <input class="form-check-input" type="checkbox" id="mute-${cat}" ${mutedSet.has(cat) ? "" : "checked"} onchange="setPreference('${cat}', !this.checked)">
      <label class="form-check-label small" for="mute-${cat}">${cat.replace("_"," ")} notifications</label>
    </div>
  `).join("");
}

async function setPreference(category, muted) {
  await api("/notifications/preferences", { method: "PUT", body: JSON.stringify({ category, muted }) });
}

loadNotifications();
</script>
</body>
</html>
