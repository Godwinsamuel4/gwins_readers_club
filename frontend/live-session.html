<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Live Session — Gwin's Readers Club</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css?v=1785495775" rel="stylesheet">
<link rel="icon" type="image/png" href="img/logo-32.png">
<style>
  #chat-window { height: 48vh; overflow-y: auto; background:#fff; border-radius: 10px; padding: 16px; }
  .chat-msg { margin-bottom: 12px; }
  .chat-msg .author { font-weight: 600; font-size: 0.85rem; }
  .chat-msg.mine .author { color: var(--rc-purple); }
  .chat-msg.system { text-align: center; color: #888; font-size: 0.8rem; font-style: italic; }
  .chat-msg.pinned { background: #fff8e1; border-left: 3px solid var(--rc-gold); padding: 6px 10px; border-radius: 6px; }
  .reply-preview { border-left: 2px solid #ccc; padding-left: 8px; font-size: 0.78rem; color: #777; margin-bottom: 2px; }
  .reaction-pill { border: 1px solid #ddd; border-radius: 12px; padding: 0 6px; font-size: 0.75rem; margin-right: 4px; cursor: pointer; display: inline-block; }
  .reaction-pill.mine { background: var(--rc-purple); color: #fff; border-color: var(--rc-purple); }
  .msg-actions { font-size: 0.72rem; }
  .msg-actions a { color: #888; cursor: pointer; margin-right: 8px; text-decoration: none; }
  .msg-actions a:hover { color: var(--rc-purple); }
  .typing-indicator { font-size: 0.78rem; color: #888; font-style: italic; height: 18px; }
  .status-pill { border-radius: 20px; padding: 2px 10px; font-size: 0.72rem; font-weight: 600; }
  .status-live { background: #dc3545; color: #fff; }
  .status-upcoming { background: #e6e0f2; color: var(--rc-purple); }
  .status-ended { background: #e2e2e2; color: #555; }
  .side-card { max-height: 260px; overflow-y: auto; }
  .reply-banner { background: #f2f0fa; border-radius: 6px; padding: 4px 8px; font-size: 0.78rem; }
</style>
</head>
<body>

<div id="rc-nav"></div>

<div class="container py-4" style="max-width: 1100px;">
  <a href="live.html" class="small">&larr; Back to Live Discussions</a>
  <div id="session-header" class="mt-2 mb-3">Loading...</div>

  <div class="row g-3">
    <div class="col-lg-8">
      <div class="card card-rc p-3">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <div class="input-group input-group-sm" style="max-width: 260px;">
            <input type="text" class="form-control" id="search-input" placeholder="Search messages...">
            <button class="btn btn-outline-secondary" onclick="searchMessages()">🔍</button>
            <button class="btn btn-outline-secondary" onclick="clearSearch()">✕</button>
          </div>
          <div class="d-flex gap-2">
            <a class="btn btn-sm btn-outline-secondary" id="transcript-link" href="#" target="_blank">⬇ Transcript</a>
          </div>
        </div>
        <div id="pinned-banner"></div>
        <div id="chat-window">Loading messages...</div>
        <div class="typing-indicator" id="typing-indicator"></div>
        <div id="reply-banner"></div>
        <form id="chat-form" class="d-flex gap-2 mt-2">
          <input type="text" class="form-control" id="chat-input" placeholder="Type a message..." maxlength="2000">
          <button type="submit" class="btn btn-rc">Send</button>
        </form>
        <div class="text-muted small mt-1">Messages refresh automatically every 3 seconds.</div>
      </div>
    </div>

    <div class="col-lg-4">
      <div class="card card-rc p-3 mb-3">
        <h6 class="mb-2">📊 Polls</h6>
        <div id="polls-body" class="side-card">Loading...</div>
        <div id="poll-host-controls"></div>
      </div>

      <div class="card card-rc p-3 mb-3">
        <h6 class="mb-2">❓ Q&amp;A Queue</h6>
        <div id="qa-body" class="side-card mb-2">Loading...</div>
        <form id="qa-form" class="d-flex gap-2">
          <input type="text" class="form-control form-control-sm" id="qa-input" placeholder="Ask a question...">
          <button class="btn btn-rc btn-sm">Ask</button>
        </form>
      </div>

      <div class="card card-rc p-3 mb-3">
        <h6 class="mb-2">📎 Resources</h6>
        <div id="resources-body" class="side-card mb-2">Loading...</div>
        <div id="resource-host-controls"></div>
      </div>

      <div class="card card-rc p-3 mb-3">
        <h6 class="mb-2">👥 Attendees</h6>
        <div id="attendees-body" class="side-card">Loading...</div>
        <div id="attendee-host-controls" class="mt-2"></div>
      </div>

      <div class="card card-rc p-3" id="rating-card" style="display:none;">
        <h6 class="mb-2">⭐ Rate this session</h6>
        <div id="rating-body"></div>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Manage Session</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-2"><label class="form-label">Title</label><input class="form-control" id="e_title"></div>
        <div class="mb-2"><label class="form-label">Description</label><textarea class="form-control" id="e_description" rows="2"></textarea></div>
        <div class="mb-2"><label class="form-label">Slow mode (seconds)</label><input type="number" class="form-control" id="e_slowmode"></div>
        <div class="form-check mb-2"><input class="form-check-input" type="checkbox" id="e_announcement"><label class="form-check-label">Announcement-only mode</label></div>
        <div class="mb-2"><label class="form-label">Recording notes / summary</label><textarea class="form-control" id="e_notes" rows="3" placeholder="Add a summary after the session ends..."></textarea></div>
        <hr>
        <div class="d-flex gap-2 flex-wrap">
          <button class="btn btn-sm btn-outline-secondary" onclick="sendReminder()">🔔 Notify RSVPs</button>
          <button class="btn btn-sm btn-outline-secondary" onclick="exportAttendeesCsv()">⬇ Export attendees CSV</button>
          <button class="btn btn-sm btn-outline-danger" onclick="endSessionEarly()">⏹ End session now</button>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-rc" onclick="submitEdit()">Save changes</button>
      </div>
    </div>
  </div>
</div>

<div class="modal fade" id="pollModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title">Create a Poll</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <div class="mb-2"><label class="form-label">Question</label><input class="form-control" id="poll_question"></div>
        <div id="poll-options">
          <input class="form-control mb-2" placeholder="Option 1" data-poll-opt>
          <input class="form-control mb-2" placeholder="Option 2" data-poll-opt>
        </div>
        <button class="btn btn-sm btn-outline-secondary" onclick="addPollOption()">+ Add option</button>
      </div>
      <div class="modal-footer"><button class="btn btn-rc" onclick="submitPoll()">Create poll</button></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js?v=1785495775"></script>
<script>
requireAuth();
renderNav("live");
const params = new URLSearchParams(window.location.search);
const sessionId = params.get("id");
const user = getUser();
let lastMessageId = 0;
let sessionData = null;
let replyTarget = null;
let typingTimeout = null;

function canManageSession() {
  if (!sessionData) return false;
  return sessionData.host_id === user.id || ["admin", "moderator"].includes(user.role);
}

async function loadHeader() {
  const s = await api(`/live/sessions/${sessionId}`);
  sessionData = s;
  const canManage = s.host_id === user.id || ["admin", "moderator"].includes(user.role);
  const statusLabel = { upcoming: "Upcoming", live: "🔴 Live now", ended: "Ended", cancelled: "Cancelled" }[s.status] || s.status;
  document.getElementById("session-header").innerHTML = `
    <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
      <div>
        <h4>${s.title} <span class="status-pill status-${s.status}">${statusLabel}</span></h4>
        <div class="text-muted small">${new Date(s.scheduled_at).toLocaleString()} · ${s.duration_minutes} min ${s.host_name ? "· hosted by " + s.host_name : ""} ${s.co_host_names && s.co_host_names.length ? "· co-hosts: " + s.co_host_names.join(", ") : ""}</div>
        ${s.category ? `<div class="small text-muted">🏷️ ${s.category}${s.book_title ? " · 📖 " + s.book_title : ""}</div>` : ""}
        <p class="small mt-2">${s.description || ""}</p>
        ${s.status === "live" ? `<div class="small text-danger">👀 ${s.viewer_count} watching now</div>` : ""}
        ${s.announcement_only ? `<div class="small text-muted">📢 Announcement-only mode — only the host can post</div>` : ""}
        ${s.recording_notes ? `<div class="alert alert-light small mt-2 mb-0"><strong>Session notes:</strong> ${s.recording_notes}</div>` : ""}
      </div>
      ${canManage ? `<button class="btn btn-sm btn-outline-secondary" onclick="openEditModal()">Manage</button>` : ""}
    </div>
    ${!s.is_cancelled && s.status !== "ended" ? `
      <button class="btn btn-sm ${s.is_attending ? "btn-rc" : "btn-outline-secondary"} mt-2" onclick="toggleRsvp(${s.id}, ${s.is_attending})">
        ${s.is_attending ? "✓ Going" : (s.is_waitlisted ? "⏳ Waitlisted" : "RSVP")} (${s.rsvp_count}${s.max_capacity ? "/" + s.max_capacity : ""} attending${s.waitlist_count ? ", " + s.waitlist_count + " waitlisted" : ""})
      </button>` : ""}
  `;
  document.getElementById("transcript-link").href = `/api/live/sessions/${sessionId}/transcript`;
  document.getElementById("chat-input").disabled = s.is_cancelled;

  if (s.status === "ended") {
    document.getElementById("rating-card").style.display = "block";
    loadRatingWidget();
  }
}

async function toggleRsvp(id, isAttending) {
  const r = await api(`/live/sessions/${id}/rsvp`, { method: isAttending ? "DELETE" : "POST" });
  if (r && r.waitlisted) alert("This session is full — you've been added to the waitlist.");
  loadHeader();
}

function openEditModal() {
  document.getElementById("e_title").value = sessionData.title;
  document.getElementById("e_description").value = sessionData.description || "";
  document.getElementById("e_slowmode").value = sessionData.slow_mode_seconds || 0;
  document.getElementById("e_announcement").checked = sessionData.announcement_only;
  document.getElementById("e_notes").value = sessionData.recording_notes || "";
  new bootstrap.Modal(document.getElementById("editModal")).show();
}

async function submitEdit() {
  await api(`/live/sessions/${sessionId}`, {
    method: "PUT",
    body: JSON.stringify({
      title: document.getElementById("e_title").value,
      description: document.getElementById("e_description").value,
      slow_mode_seconds: parseInt(document.getElementById("e_slowmode").value) || 0,
      announcement_only: document.getElementById("e_announcement").checked,
      recording_notes: document.getElementById("e_notes").value,
    }),
  });
  bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
  loadHeader();
}

async function sendReminder() {
  const r = await api(`/live/sessions/${sessionId}/notify-reminder`, { method: "POST" });
  alert(r.message);
}

function exportAttendeesCsv() {
  window.open(`/api/live/sessions/${sessionId}/attendees/export`, "_blank");
}

async function endSessionEarly() {
  if (!confirm("End this session now?")) return;
  await api(`/live/sessions/${sessionId}/end`, { method: "PUT" });
  bootstrap.Modal.getInstance(document.getElementById("editModal")).hide();
  loadHeader();
}

// ---------------- chat ----------------

function renderMessage(m) {
  const mine = m.user_id === user.id;
  if (m.is_system) {
    return `<div class="chat-msg system">— ${m.content} —</div>`;
  }
  const reactionsHtml = (m.reactions || []).map(r => `
    <span class="reaction-pill ${r.reacted_by_me ? "mine" : ""}" onclick="toggleReaction(${m.id}, '${r.emoji}')">${r.emoji} ${r.count}</span>
  `).join("");
  const quickReactions = ["👍", "❤️", "😂", "😮"].map(e => `<span class="reaction-pill" onclick="toggleReaction(${m.id}, '${e}')">${e}</span>`).join("");
  return `
    <div class="chat-msg ${mine ? "mine" : ""} ${m.is_pinned ? "pinned" : ""}" id="msg-${m.id}">
      ${m.reply_to_id ? `<div class="reply-preview">↪ ${m.reply_to_author || "someone"}: ${m.reply_to_snippet || ""}</div>` : ""}
      <div class="author">${m.author_name} ${m.is_pinned ? "📌" : ""}</div>
      <div>${m.is_deleted ? "<em class='text-muted'>[message deleted]</em>" : escapeHtml(m.content)}</div>
      <div class="msg-actions">
        <span class="text-muted">${new Date(m.created_at).toLocaleTimeString()}${m.edited_at ? " (edited)" : ""}</span>
        ${!m.is_deleted ? `
          <a onclick="startReply(${m.id}, '${(m.author_name||"").replace(/'/g,"")}', '${escapeHtml((m.content||"").slice(0,60)).replace(/'/g,"")}')">Reply</a>
          ${mine ? `<a onclick="editMessage(${m.id})">Edit</a>` : ""}
          ${(mine || canManageSession()) ? `<a onclick="deleteMessage(${m.id})">Delete</a>` : ""}
          ${canManageSession() ? `<a onclick="togglePin(${m.id})">${m.is_pinned ? "Unpin" : "Pin"}</a>` : ""}
          ${canManageSession() && !mine ? `<a onclick="muteUser(${m.user_id})">Mute</a> <a onclick="banUser(${m.user_id})">Ban</a>` : ""}
        ` : ""}
      </div>
      <div class="reactions mt-1">${reactionsHtml}${quickReactions}</div>
    </div>
  `;
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str || "";
  return div.innerHTML;
}

async function loadMessages() {
  const messages = await api(`/live/sessions/${sessionId}/messages?after_id=${lastMessageId}`);
  const win = document.getElementById("chat-window");
  if (lastMessageId === 0) win.innerHTML = "";
  if (messages.length) {
    const atBottom = win.scrollTop + win.clientHeight >= win.scrollHeight - 40;
    messages.forEach(m => {
      win.insertAdjacentHTML("beforeend", renderMessage(m));
      lastMessageId = Math.max(lastMessageId, m.id);
    });
    if (atBottom || lastMessageId === 0) win.scrollTop = win.scrollHeight;
  }
  loadPinned();
}

async function loadPinned() {
  // Pinned banner pulled from the currently rendered messages, cheap re-scan.
  const pins = [...document.querySelectorAll(".chat-msg.pinned")];
  const banner = document.getElementById("pinned-banner");
  if (!pins.length) { banner.innerHTML = ""; return; }
  const last = pins[pins.length - 1];
  banner.innerHTML = `<div class="reply-banner mb-2">📌 Pinned: ${last.querySelector("div:nth-child(2)").innerText}</div>`;
}

function startReply(id, author, snippet) {
  replyTarget = id;
  document.getElementById("reply-banner").innerHTML = `
    <div class="reply-banner d-flex justify-content-between align-items-center mb-1">
      <span>Replying to <strong>${author}</strong>: ${snippet}</span>
      <a onclick="cancelReply()" style="cursor:pointer;">✕</a>
    </div>`;
  document.getElementById("chat-input").focus();
}
function cancelReply() { replyTarget = null; document.getElementById("reply-banner").innerHTML = ""; }

async function editMessage(id) {
  const el = document.querySelector(`#msg-${id} div:nth-child(2)`);
  const current = el ? el.innerText : "";
  const updated = prompt("Edit your message:", current);
  if (updated === null) return;
  try {
    await api(`/live/messages/${id}`, { method: "PUT", body: JSON.stringify({ content: updated }) });
    lastMessageId = 0;
    loadMessages();
  } catch (err) { alert(err.message); }
}

async function deleteMessage(id) {
  if (!confirm("Delete this message?")) return;
  await api(`/live/messages/${id}`, { method: "DELETE" });
  lastMessageId = 0;
  loadMessages();
}

async function togglePin(id) {
  await api(`/live/messages/${id}/pin`, { method: "PUT" });
  lastMessageId = 0;
  loadMessages();
}

async function toggleReaction(id, emoji) {
  await api(`/live/messages/${id}/reactions`, { method: "POST", body: JSON.stringify({ emoji }) });
  lastMessageId = 0;
  loadMessages();
}

async function muteUser(userId) {
  if (!confirm("Mute this participant for this session?")) return;
  await api(`/live/sessions/${sessionId}/mute/${userId}`, { method: "POST" });
  alert("User muted.");
}

async function banUser(userId) {
  if (!confirm("Remove this participant from the session? This also cancels their RSVP.")) return;
  await api(`/live/sessions/${sessionId}/ban/${userId}`, { method: "POST" });
  alert("User banned from this session.");
}

async function searchMessages() {
  const q = document.getElementById("search-input").value.trim();
  if (!q) return;
  const results = await api(`/live/sessions/${sessionId}/messages/search?q=${encodeURIComponent(q)}`);
  const win = document.getElementById("chat-window");
  win.innerHTML = results.length ? results.map(renderMessage).join("") : `<p class="text-muted small">No messages match "${q}".</p>`;
}

function clearSearch() {
  document.getElementById("search-input").value = "";
  lastMessageId = 0;
  loadMessages();
}

document.getElementById("chat-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chat-input");
  const content = input.value.trim();
  if (!content) return;
  try {
    await api(`/live/sessions/${sessionId}/messages`, {
      method: "POST",
      body: JSON.stringify({ content, reply_to_id: replyTarget }),
    });
    input.value = "";
    cancelReply();
    lastMessageId = lastMessageId; // keep — new message picked up on next poll
    loadMessages();
    pingPresence(false);
  } catch (err) {
    alert(err.message);
  }
});

document.getElementById("chat-input").addEventListener("input", () => {
  pingPresence(true);
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => pingPresence(false), 2000);
});

async function pingPresence(isTyping) {
  try {
    const r = await api(`/live/sessions/${sessionId}/presence`, { method: "POST", body: JSON.stringify({ is_typing: isTyping }) });
    renderTyping(r);
  } catch (e) { /* presence is best-effort */ }
}

function renderTyping(p) {
  const el = document.getElementById("typing-indicator");
  if (!p || !p.typing_names || !p.typing_names.length) { el.innerText = ""; return; }
  el.innerText = p.typing_names.length === 1 ? `${p.typing_names[0]} is typing…` : `${p.typing_names.join(", ")} are typing…`;
}

// ---------------- polls ----------------

async function loadPolls() {
  const polls = await api(`/live/sessions/${sessionId}/polls`);
  const body = document.getElementById("polls-body");
  body.innerHTML = polls.length ? polls.map(p => `
    <div class="mb-3 pb-2 border-bottom">
      <div class="fw-semibold small">${p.question} ${p.is_closed ? '<span class="badge bg-secondary">closed</span>' : ""}</div>
      ${p.options.map(o => `
        <div class="d-flex justify-content-between align-items-center small mt-1">
          <span>${o.text} ${p.my_vote_option_id === o.id ? "✓" : ""}</span>
          <span>
            <span class="text-muted">${o.vote_count}</span>
            ${!p.is_closed ? `<button class="btn btn-sm btn-outline-secondary py-0 px-1 ms-1" onclick="votePoll(${p.id}, ${o.id})">Vote</button>` : ""}
          </span>
        </div>
      `).join("")}
      ${canManageSession() && !p.is_closed ? `<button class="btn btn-sm btn-outline-danger py-0 px-1 mt-1" onclick="closePoll(${p.id})">Close poll</button>` : ""}
    </div>
  `).join("") : `<p class="text-muted small">No polls yet.</p>`;

  document.getElementById("poll-host-controls").innerHTML = canManageSession() ?
    `<button class="btn btn-sm btn-rc mt-1" data-bs-toggle="modal" data-bs-target="#pollModal">+ New poll</button>` : "";
}

async function votePoll(pollId, optionId) {
  await api(`/live/polls/${pollId}/vote`, { method: "POST", body: JSON.stringify({ option_id: optionId }) });
  loadPolls();
}
async function closePoll(pollId) {
  await api(`/live/polls/${pollId}/close`, { method: "PUT" });
  loadPolls();
}
function addPollOption() {
  const container = document.getElementById("poll-options");
  const input = document.createElement("input");
  input.className = "form-control mb-2";
  input.placeholder = `Option ${container.children.length + 1}`;
  input.setAttribute("data-poll-opt", "");
  container.appendChild(input);
}
async function submitPoll() {
  const question = document.getElementById("poll_question").value.trim();
  const options = [...document.querySelectorAll("[data-poll-opt]")].map(i => i.value.trim()).filter(Boolean);
  if (!question || options.length < 2) { alert("Add a question and at least 2 options."); return; }
  await api(`/live/sessions/${sessionId}/polls`, { method: "POST", body: JSON.stringify({ question, options }) });
  bootstrap.Modal.getInstance(document.getElementById("pollModal")).hide();
  loadPolls();
}

// ---------------- Q&A ----------------

async function loadQuestions() {
  const questions = await api(`/live/sessions/${sessionId}/questions`);
  const body = document.getElementById("qa-body");
  body.innerHTML = questions.length ? questions.map(q => `
    <div class="mb-2 pb-2 border-bottom small">
      <div>${q.question} ${q.is_answered ? '<span class="badge bg-success">answered</span>' : ""}</div>
      <div class="text-muted">— ${q.author_name}</div>
      ${q.answer ? `<div class="mt-1"><strong>A:</strong> ${q.answer}</div>` : ""}
      <div class="d-flex gap-2 mt-1">
        <a style="cursor:pointer;" onclick="upvoteQuestion(${q.id})">▲ ${q.upvote_count}${q.upvoted_by_me ? " (upvoted)" : ""}</a>
        ${canManageSession() && !q.is_answered ? `<a style="cursor:pointer;" onclick="answerQuestion(${q.id})">Answer</a>` : ""}
      </div>
    </div>
  `).join("") : `<p class="text-muted small">No questions yet — be the first to ask!</p>`;
}

async function upvoteQuestion(id) {
  await api(`/live/questions/${id}/upvote`, { method: "POST" });
  loadQuestions();
}
async function answerQuestion(id) {
  const answer = prompt("Your answer:");
  if (!answer) return;
  await api(`/live/questions/${id}/answer`, { method: "PUT", body: JSON.stringify({ answer }) });
  loadQuestions();
}
document.getElementById("qa-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("qa-input");
  const question = input.value.trim();
  if (!question) return;
  await api(`/live/sessions/${sessionId}/questions`, { method: "POST", body: JSON.stringify({ question }) });
  input.value = "";
  loadQuestions();
});

// ---------------- resources ----------------

async function loadResources() {
  const resources = await api(`/live/sessions/${sessionId}/resources`);
  document.getElementById("resources-body").innerHTML = resources.length ? resources.map(r => `
    <div class="small mb-1 d-flex justify-content-between align-items-center">
      <a href="${r.url}" target="_blank">${r.title}</a>
      ${canManageSession() ? `<a style="cursor:pointer;" onclick="deleteResource(${r.id})">✕</a>` : ""}
    </div>
  `).join("") : `<p class="text-muted small">No resources shared yet.</p>`;

  document.getElementById("resource-host-controls").innerHTML = canManageSession() ? `
    <div class="input-group input-group-sm mt-2">
      <input class="form-control" id="res_title" placeholder="Title">
      <input class="form-control" id="res_url" placeholder="URL">
      <button class="btn btn-outline-secondary" onclick="addResource()">Add</button>
    </div>` : "";
}
async function addResource() {
  const title = document.getElementById("res_title").value.trim();
  const url = document.getElementById("res_url").value.trim();
  if (!title || !url) return;
  await api(`/live/sessions/${sessionId}/resources`, { method: "POST", body: JSON.stringify({ title, url }) });
  loadResources();
}
async function deleteResource(id) {
  await api(`/live/resources/${id}`, { method: "DELETE" });
  loadResources();
}

// ---------------- attendees ----------------

async function loadAttendees() {
  try {
    const attendees = await api(`/live/sessions/${sessionId}/attendees`);
    document.getElementById("attendees-body").innerHTML = attendees.length ? attendees.map(a => `<div class="small">${a.name}</div>`).join("") : `<p class="text-muted small">No RSVPs yet.</p>`;
  } catch (err) {
    document.getElementById("attendees-body").innerHTML = `<p class="text-muted small">Attendee list is private.</p>`;
  }
  document.getElementById("attendee-host-controls").innerHTML = canManageSession() ? `
    <div class="input-group input-group-sm">
      <input class="form-control" id="cohost_id" placeholder="User ID to add as co-host">
      <button class="btn btn-outline-secondary" onclick="addCohost()">+ Co-host</button>
    </div>` : "";
}
async function addCohost() {
  const id = document.getElementById("cohost_id").value.trim();
  if (!id) return;
  await api(`/live/sessions/${sessionId}/cohosts/${id}`, { method: "POST" });
  alert("Co-host added.");
  loadHeader();
}

// ---------------- rating ----------------

async function loadRatingWidget() {
  const box = document.getElementById("rating-body");
  box.innerHTML = `
    <div class="mb-2">
      ${[1,2,3,4,5].map(n => `<span style="cursor:pointer; font-size:1.3rem;" onclick="setRating(${n})" id="star-${n}">☆</span>`).join("")}
    </div>
    <textarea class="form-control form-control-sm mb-2" id="rating-comment" placeholder="Optional comment..."></textarea>
    <button class="btn btn-sm btn-rc" onclick="submitRating()">Submit rating</button>
    <div id="ratings-list" class="mt-3"></div>
  `;
  window._selectedRating = 0;
  const ratings = await api(`/live/sessions/${sessionId}/ratings`);
  document.getElementById("ratings-list").innerHTML = ratings.length ? ratings.map(r => `
    <div class="small border-top pt-1 mt-1"><strong>${r.author_name}</strong> ⭐${r.rating} ${r.comment ? "— " + r.comment : ""}</div>
  `).join("") : "";
}
function setRating(n) {
  window._selectedRating = n;
  for (let i = 1; i <= 5; i++) document.getElementById(`star-${i}`).innerText = i <= n ? "★" : "☆";
}
async function submitRating() {
  if (!window._selectedRating) { alert("Pick a star rating first."); return; }
  await api(`/live/sessions/${sessionId}/rating`, {
    method: "POST",
    body: JSON.stringify({ rating: window._selectedRating, comment: document.getElementById("rating-comment").value }),
  });
  loadRatingWidget();
}

// ---------------- init ----------------

async function refreshAll() {
  await loadHeader();
  await loadMessages();
}

loadHeader();
loadMessages();
loadPolls();
loadQuestions();
loadResources();
loadAttendees();

setInterval(loadMessages, 3000);
setInterval(() => { api(`/live/sessions/${sessionId}/presence`).then(renderTyping).catch(()=>{}); }, 4000);
setInterval(loadHeader, 15000);
setInterval(loadPolls, 10000);
setInterval(loadQuestions, 10000);
</script>
</body>
</html>
